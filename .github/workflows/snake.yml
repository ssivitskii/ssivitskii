name: Update contribution snake

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - scripts/publish-snake.py

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generation script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/github-snake.svg?color_snake=#00AAFF&color_dots=#ebedf0,#c7f4d5,#79e8a0,#32cd72,#079b4e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00AAFF&color_dots=#161b22,#143c2d,#166b42,#20a660,#04E061

      - name: Publish generated SVGs to output branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-snake.py
