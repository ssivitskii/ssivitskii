<text x="255" y="216" font-size="20" fill="#FFAF6A" font-weight="650" >Recall at a daily 1% review budget</text>
<text x="255" y="246" font-size="18" fill="#D1B699" font-weight="400" >24.1% basic → 71.0% with history</text>
