<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
<title id="title">FraudGuard — 71.0% recall with seven-day label delay</title><desc id="desc">Fraud Detection Handbook synthetic transaction replay, 18 June–15 July 2018. With seven-day label delay, point-in-time history reaches 71.0% recall versus 24.1% for basic features at the same daily top-1% review budget. History finds 1,732 of 2,439 frauds in 2,698 end-of-day reviews. This is historical evaluation, not live blocking.</desc>
