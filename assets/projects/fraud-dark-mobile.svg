<text x="30" y="89" font-size="36" fill="#FFF1E1" font-weight="750" letter-spacing="-1">FraudGuard</text>
<text x="32" y="130" font-size="21" fill="#D1B699" font-weight="400" >Fraud Detection Handbook / synthetic replay</text>
<text x="32" y="165" font-size="18" fill="#D1B699" font-weight="400" >Point-in-time history / 7-day label delay</text>
<path d="M32 187H568" stroke="#58412B"/>
<text x="30" y="247" font-size="58" fill="#FFF1E1" font-weight="750" letter-spacing="-2">71.0%</text>
<text x="32" y="285" font-size="22" fill="#FFAF6A" font-weight="650" >Recall at a daily 1% review budget</text>
<text x="32" y="319" font-size="19" fill="#D1B699" font-weight="400" >24.1% basic → 71.0% with history</text>
<text x="32" y="355" font-size="17" fill="#D1B699" font-weight="400" >1,732 / 2,439 frauds found · 2,698 reviews.</text>
<text x="32" y="379" font-size="17" fill="#D1B699" font-weight="400" >Synthetic replay · 7-day label delay · end-of-day review.</text>
